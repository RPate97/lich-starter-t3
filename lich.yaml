version: "1"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - { container_port: 5432, published_env: POSTGRES_HOST_PORT }
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lich_starter_t3
    tmpfs:
      - /var/lib/postgresql/data    # ephemeral; gone on `lich down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 1s
      retries: 30
    lifecycle:
      # Push the Prisma schema BEFORE web starts. Top-level `after_up` would
      # run after everything is "ready", but the Next.js home page queries
      # the DB and fails its ready_when probe if the schema isn't there yet.
      after_ready:
        - npx prisma db push --skip-generate

owned:
  web:
    cmd: npm run dev
    cwd: .
    port: { published_env: PORT }
    depends_on: [postgres]
    ready_when:
      http_get: /
      timeout: 60s

env_files:
  - .env

env:
  # Lich allocates the postgres host port dynamically per worktree, so the
  # DATABASE_URL is built from interpolation. The .env file's DATABASE_URL
  # (used by `npm run dev` without lich) is overridden by this literal at
  # `lich up` time.
  DATABASE_URL: "postgresql://postgres:password@localhost:${services.postgres.host_port}/lich_starter_t3"

lifecycle:
  before_up:
    - "[ -d node_modules ] || npm install --no-audit --no-fund"
